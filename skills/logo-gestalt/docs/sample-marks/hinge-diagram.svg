<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hinge diagram: isometric cube with cursor carve and shared vertical spine">
  <title>Hinge diagram — cube × cursor gestalt</title>
  <desc>Educational diagram: black isometric hex cube, white cursor chevron carved from front face, orange dashed vertical at x=256 marking the shared hinge.</desc>

  <rect width="512" height="512" fill="#1a1a1e"/>

  <!-- Solid isometric hex cube with cursor void (evenodd) -->
  <path fill="#000000" fill-rule="evenodd" d="
    M 256  88
    L 404 176
    L 404 336
    L 256 424
    L 108 336
    L 108 176
    Z
    M 256 152
    L 322 206
    L 292 206
    L 292 352
    L 220 352
    L 220 206
    L 190 206
    Z
  "/>

  <!-- Subtle facet guides (teaching) -->
  <path fill="none" stroke="#2a2a30" stroke-width="1" d="M 108 176 L 256 152 L 404 176"/>
  <path fill="none" stroke="#2a2a30" stroke-width="1" d="M 108 336 L 256 360 L 404 336"/>

  <!-- Hinge — shared vertical at x=256 -->
  <line x1="256" y1="80" x2="256" y2="432"
        stroke="#f97316" stroke-width="3" stroke-dasharray="12 8"
        stroke-linecap="round"/>
  <text x="268" y="100" fill="#f97316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">hinge</text>
  <text x="268" y="118" fill="#8b8b96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">x = 256</text>

  <text x="24" y="40" fill="#e8e8ed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Cube × Cursor</text>
  <text x="24" y="60" fill="#8b8b96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Shared vertical = stem + front edge</text>

  <rect x="24" y="468" width="16" height="16" fill="#000000"/>
  <text x="48" y="480" fill="#8b8b96" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">cube mass</text>
  <rect x="140" y="468" width="16" height="16" fill="#1a1a1e" stroke="#ffffff" stroke-width="1"/>
  <text x="164" y="480" fill="#8b8b96" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">cursor void</text>
  <line x1="280" y1="476" x2="308" y2="476" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="316" y="480" fill="#8b8b96" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">shared hinge</text>
</svg>
